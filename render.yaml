# Déploiement gratuit de SRSP.AMM sur Render.
# La base est Neon Postgres (gratuite et permanente), pas la base Render
# gratuite qui expire après 30 jours.
databases: []

services:
  - type: web
    name: srsp-suivi-amm
    runtime: docker
    plan: free
    region: frankfurt
    branch: deploy/render
    repo: https://github.com/randrianirinaalbert2-cmd/suivi-dossiers.git
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "SRSP.AMM — Suivi des dossiers Solde et Visa"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://srsp-suivi-amm.onrender.com
      - key: FORCE_HTTPS
        value: true
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_ENCRYPT
        value: false
      - key: SESSION_PATH
        value: /
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Les fichiers restent privés dans Neon Object Storage.
      - key: UPLOADS_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true

      # Migrations non destructives au démarrage du conteneur.
      - key: RUN_MIGRATIONS
        value: true
